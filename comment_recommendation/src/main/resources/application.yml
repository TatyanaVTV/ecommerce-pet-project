server:
  port: 8083

spring:
  application:
    name: comment-and-recommendation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/comment_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.springframework: DEBUG
